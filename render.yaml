pservices:
  - type: web
    name: betterclss-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: CANVAS_DOMAIN
        value: usc.instructure.com
      - key: MAX_OVERDUE_DAYS
        value: 20
      - key: AI_AUTOSTART_OLLAMA
        value: 0
      - key: AI_MODEL_KEEP_ALIVE
        value: 0m
      # AI providers are bring-your-own-key (BYOK): users enter their own
      # Groq/Gemini API keys in the app Settings. No provider keys live in the
      # environment, so one user's quota can never be consumed by others.
