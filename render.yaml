pservices:
  - type: web
    name: betterclss-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: CANVAS_DOMAIN
        value: usc.instructure.com
      - key: MAX_OVERDUE_DAYS
        value: 20
      # AI is bring-your-own-key (BYOK): users enter their own Groq/Gemini API
      # keys in the app Settings and they are sent per request. No AI provider
      # keys live in the environment, so one user's quota can never be consumed
      # by others, and the backend never falls back to a shared key.
